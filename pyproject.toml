[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-workbench"
version = "0.1.0"
description = "Locally controlled AI, memory, and learning workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "psutil>=6,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
training = ["torch>=2.4,<3", "transformers>=4.45,<5", "peft>=0.13,<1", "accelerate>=1,<2"]

[project.scripts]
personal-ai = "personal_ai.__main__:main"

[tool.setuptools.package-data]
personal_ai = ["static/*"]

[tool.setuptools.packages.find]
include = ["personal_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
